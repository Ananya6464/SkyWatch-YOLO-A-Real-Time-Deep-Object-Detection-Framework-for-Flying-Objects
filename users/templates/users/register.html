```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SkyWatch YOLO</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            color: #1e293b;
        }

        /* Navbar */

        nav {
            height: 75px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
        }

        .logo span {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* Register */

        .register-section {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-container {
            width: 480px;
            max-width: 100%;
            background: rgba(255,255,255,0.97);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        /* Form */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37,99,235,0.3);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-text a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .note {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 18px;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            nav a {
                margin-left: 10px;
            }

            .register-container {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


<!-- Navigation -->

<nav>

    <div class="logo">
        🚀 SkyWatch <span>YOLO</span>
    </div>

    <div>
        <a href="/">Home</a>
        <a href="/login/">Login</a>
        <a href="/register/">Register</a>
    </div>

</nav>


<!-- Registration -->

<section class="register-section">

    <div class="register-container">

        <div class="icon">
            🚀
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join the SkyWatch YOLO system
        </p>


        <form method="POST">

            {% csrf_token %}


            <label>
                User Name
            </label>

            <input
                type="text"
                name="user_name"
                placeholder="Enter your username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label>
                Mobile Number
            </label>

            <input
                type="text"
                name="mobile_number"
                placeholder="Enter your mobile number"
                required
            >


            <label>
                Place
            </label>

            <input
                type="text"
                name="place"
                placeholder="Enter your place"
                required
            >


            <button type="submit">
                🚀 Create Account
            </button>

        </form>


        <p class="login-text">

            Already have an account?

            <a href="/login/">
                Login Here
            </a>

        </p>


        <p class="note">
            🛡️ Your information is securely stored
        </p>

    </div>

</section>


</body>

</html>
```
